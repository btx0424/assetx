[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "assetx"
version = "0.1.0"
description = "Compose and transform MuJoCo (MJCF) robot models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = []
keywords = ["mujoco", "mjcf", "robotics", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Robotics",
]
dependencies = [
    "mujoco",
    "scipy",
    "trimesh",
    "viser",
    "usd-core",
]

[project.scripts]
assetx = "assetx.cli:main"

[project.optional-dependencies]
research = [
    "mujoco-warp",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
# Conda interpreters ship an old libstdc++ that breaks system Mesa (GLFW/OpenGL
# viewer fails with GLIBCXX_3.4.30 not found), so never build the venv on one.
python-preference = "only-managed"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
